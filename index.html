<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiteIndex - Bangladesh Banks & Jobs</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="brand">
    <h1>SiteIndex</h1>
    <span class="tagline" data-i18n="tagline">Bangladesh banks & jobs</span>
  </div>
  <nav>
    <button data-tab="banks" class="active" data-i18n="navBanks">Banks</button>
    <button data-tab="jobs" data-i18n="navJobs">Job Links</button>
  </nav>
  <button id="langToggle" class="lang-toggle" aria-label="Switch language">বাংলা</button>
</header>

<main>
  <section id="banks" class="tab active">
    <div class="section-head">
      <div>
        <h2 data-i18n="banksTitle">Bangladesh Banks</h2>
        <p class="muted" data-i18n="banksSubtitle">Official websites and career pages, grouped by category.</p>
      </div>
      <span id="bankCount" class="count"></span>
    </div>
    <div class="controls">
      <input id="search" data-i18n-placeholder="searchPlaceholder" placeholder="Search banks..." />
      <select id="categoryFilter"></select>
    </div>
    <div id="banksGrid" class="grid"></div>
  </section>

  <section id="jobs" class="tab">
    <div class="section-head">
      <div>
        <h2 data-i18n="jobsTitle">Job Links</h2>
        <p class="muted" data-i18n="jobsSubtitle">Job portals and bdjobs categories.</p>
      </div>
    </div>

    <div id="featuredPortal" class="featured"></div>

    <h3 class="subhead" data-i18n="bdjobsCategories">bdjobs Categories</h3>
    <div id="jobsList" class="job-list"></div>
  </section>
</main>

<footer>
  <p data-i18n="footer">Generated from the Bangladesh Bank Careers Directory 2026 and bdjobs links.</p>
</footer>
<script src="app.js"></script>
</body>
</html>
